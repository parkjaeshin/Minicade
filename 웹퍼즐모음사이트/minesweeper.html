<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지뢰찾기 - Web Arcade</title>
    <link rel="stylesheet" href="minesweeper.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="game-wrapper">
        <header>
            <h1>지뢰찾기</h1>
            <div class="stats">
                <div class="stat-item">지뢰: <span id="mine-count">10</span></div>
                <div class="stat-item">시간: <span id="timer">0</span></div>
            </div>
            <button id="reset-btn">다시 시작</button>
        </header>
        <div id="game-board" class="board"></div>
        <div id="message" class="message"></div>
        <footer>
            <button onclick="window.close()">게임 종료</button>
        </footer>
    </div>
    <script src="minesweeper.js"></script>
</body>

</html>
