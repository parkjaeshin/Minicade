<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Arcade - 웹 퍼즐 월드</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="background-animation"></div>

    <header>
        <div class="containerHeader">
            <h1>Web Arcade</h1>
        </div>
    </header>

    <main>
        <!-- Left Side: Banner Placeholder -->
        <aside class="sidebar left-banner" id="banner-left">
            <div class="banner-placeholder">
                <span>AD SLOT</span>
            </div>
        </aside>

        <!-- Center: Game Grid -->
        <section class="game-container">
            <div class="game-grid" id="game-grid">
                <!-- Game 1 -->
                <div class="game-card">
                    <div class="game-icon">💣</div>
                    <h3>지뢰찾기</h3>
                    <button class="play-btn" onclick="window.location.href='minesweeper.html'">START</button>
                </div>
                <!-- Game 2 -->
                <div class="game-card">
                    <div class="game-icon">♠️</div>
                    <h3>리듬게임</h3>
                    <button class="play-btn" onclick="window.location.href='beat-looper.html'">START</button>
                </div>
                <!-- Game 3 -->
                <div class="game-card">
                    <div class="game-icon">♠️</div>
                    <h3>솔리테어</h3>
                    <button class="play-btn" onclick="window.location.href='solitaire.html'">START</button>
                </div>
                <!-- Game 5 -->
                <div class="game-card">
                    <div class="game-icon">🧱</div>
                    <h3>블록 배치</h3>
                    <button class="play-btn" onclick="window.location.href='block_placement.html'">START</button>
                </div>
                <!-- Game 6 -->
                <div class="game-card">
                    <div class="game-icon">⚡</div>
                    <h3>회로 복구</h3>
                    <button class="play-btn" onclick="window.location.href='circuit_repair.html'">START</button>
                </div>
                <!-- Game 6 -->
                <div class="game-card">
                    <div class="game-icon">🏎️</div>
                    <h3>레이싱</h3>
                    <button class="play-btn">START</button>
                </div>
                <!-- Game 7 -->
                <div class="game-card">
                    <div class="game-icon">🏹</div>
                    <h3>아처리</h3>
                    <button class="play-btn">START</button>
                </div>
                <!-- Game 8 -->
                <div class="game-card">
                    <div class="game-icon">🍔</div>
                    <h3>요리 타이쿤</h3>
                    <button class="play-btn">START</button>
                </div>
                <!-- Game 9 -->
                <div class="game-card">
                    <div class="game-icon">🍪</div>
                    <h3>두쫀쿠 클리커</h3>
                    <button class="play-btn" onclick="window.location.href='dujonku_clicker.html'">START</button>
                </div>
        </section>

        <!-- Right Side: Banner Placeholder -->
        <aside class="sidebar right-banner" id="banner-right">
            <div class="banner-placeholder">
                <span>AD SLOT</span>
            </div>
        </aside>
    </main>

    <footer>
        <p>&copy; 2026 Web Arcade. All rights reserved.</p>
    </footer>

    <!-- Contact Modal -->
    <div id="contact-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Contact Us</h2>
                <span class="close-modal">&times;</span>
            </div>
            <form id="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required placeholder="How can we help?"></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
            <div id="form-status" class="form-status"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
