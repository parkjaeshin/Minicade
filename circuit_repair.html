<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circuit Repair - Arknights: Endfield Style</title>
    <link rel="stylesheet" href="circuit_repair.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Orbitron:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="endfield-overlay"></div>

    <div class="game-wrapper">
        <header class="game-header">
            <div class="header-left">
                <span class="system-tag">SYSTEM STATUS: <span class="status-active">MAINTENANCE</span></span>
                <h1 class="game-title">ORIGINIUM CIRCUIT REPAIR</h1>
            </div>
            <div class="header-right">
                <button class="back-btn" onclick="window.close()">EXIT INTERFACE</button>
            </div>
        </header>

        <main class="game-layout">
            <div class="grid-container">
                <div class="grid" id="circuit-grid">
                    <!-- Grid cells will be generated by JS -->
                </div>
            </div>

            <aside class="inventory-panel">
                <h2 class="panel-title">AVAILABLE COMPONENTS</h2>
                <div class="inventory" id="piece-inventory">
                    <!-- Inventory pieces will be generated by JS -->
                </div>
                <div class="controls-panel">
                    <button id="reset-btn" class="control-btn">REBOOT SYSTEM</button>
                    <p class="instruction-text">
                        Connect all <span class="highlight">NODES</span> to the <span
                            class="highlight-source">SOURCE</span>.
                        Click placed pieces to <span class="highlight-alt">ROTATE</span>.
                    </p>
                </div>
            </aside>
        </main>

        <footer class="game-footer">
            <div class="footer-bar"></div>
            <p class="copyright">ENDOROS TECHNICAL SOLUTIONS &copy; 2026</p>
        </footer>
    </div>

    <!-- Victory Modal -->
    <div id="victory-modal" class="modal">
        <div class="modal-content">
            <h2 class="victory-title">CONNECTION RESTORED</h2>
            <p>All subsystems operational. Power flow stabilized.</p>
            <button class="modal-btn" onclick="location.reload()">NEXT SEQUENCE</button>
        </div>
    </div>

    <script src="circuit_repair.js"></script>
</body>

</html>
