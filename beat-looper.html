<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beat Looper - 리듬게임</title>
    <link rel="stylesheet" href="beat-looper.css">
</head>

<body>
    <div class="container">
        <h1>🎵 Beat Looper</h1>
        <div class="game-info">
            <div>Score: <span id="score">0</span></div>
            <div>Combo: <span id="combo">0</span></div>
            <button id="startBtn">▶️ START</button>
        </div>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div class="controls">
            <p>스페이스바 또는 터치로 타이밍 맞춰 클릭!</p>
        </div>
    </div>
    <script src="beat-looper.js"></script>
</body>

</html>
